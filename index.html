<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css">

    <title>Frontend Mentor | [Challenge Name Here]</title>

  </head>
  <body>
    <div class="container">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="theme-icon"
          aria-hidden="true"
        >
          <path d="M12 2v2" />
          <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.508.715Z" />
          <path d="m16.2 7.8 1.4-1.4" />
          <path d="M18 12h2" />
          <path d="m16.2 16.2 1.4 1.4" />
          <path d="M12 18v2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="M6 12H4" />
          <path d="m6.34 6.34-1.41-1.41" />
        </svg>
      </button>
      <img src="./images/bg-top.svg" alt="Top pattern" class="top-pattern">
      <img src="./images/bg-bottom.svg" alt="Top pattern" class="bottom-pattern">
      <header class="header">
        <h1 class="title">Our Pricing</h1>
        <div class="selector">
          <p>Annually</p>
           <label class="switch" for="toggle" tabindex="0">
            <input type="checkbox" id="toggle" tabindex="-1">
            <div class="checkbox-slider"></div>
          </label>
          <p>Monthly</p>
        </div>
      </header>
      <main class="cards">
        <article class="card">
          <h2 class="plan__tipe">Basic</h2>
          <p class="price">&dollar;<strong id="basic-price" >199.99</strong></p>
          <ul class="plan__description">
            <li>500 GB Storage</li>
            <li>2 Users Allowed</li>
            <li>Send up to 3 GB</li>
          </ul>
          <button type="button">Learn More</button>
        </article>
        <article class="card card__focus">
          <h2 class="plan__tipe">Professional</h2>
          <p class="price">&dollar;<strong id="professional-price">249.99</strong></p>
          <ul class="plan__description">
            <li>1 TB Storage</li>
            <li>5 Users Allowed</li>
            <li>Send up to 10 GB</li>
          </ul>
          <button type="button">Learn More</button>
        </article>
        <article class="card">
          <h2 class="plan__tipe">Master</h2>
          <p class="price">&dollar;<strong id="master-price">399.99</strong></p>
          <ul class="plan__description">
            <li>2 TB Storage</li>
            <li>10 Users Allowed</li>
            <li>Send up to 10 GB</li>
          </ul>
          <button type="button">Learn More</button>
        </article>

      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
